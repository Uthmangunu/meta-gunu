services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meta_gunu
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: meta_gunu
    secrets:
      - postgres_password
    ports:
      - "55432:5432"
    volumes:
      - meta_gunu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meta_gunu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meta_gunu_postgres:

secrets:
  postgres_password:
    file: .secrets/postgres_password
